version: '3.8'

services:
  # Database PostgreSQL
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=cadoreadomicilio
      - POSTGRES_USER=cadore_user
      - POSTGRES_PASSWORD=changeme_in_production
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadore_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applicazione Django
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 cadoreadomicilio.wsgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_ENV=production
      - DATABASE_URL=postgresql://cadore_user:changeme_in_production@db:5432/cadoreadomicilio
    depends_on:
      db:
        condition: service_healthy

  # Nginx reverse proxy (opzionale per produzione)
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
